  <path d="M 50 30 L 50 170 M 50 30 Q 50 30 100 30 Q 130 30 130 60 Q 130 90 100 90 L 50 90" stroke="black" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Curved connector -->
  <path d="M 130 90 Q 160 100 160 140 Q 160 170 130 170" stroke="black" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom horizontal line (like an "L") -->
